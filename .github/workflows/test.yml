name: Test

on:
  push:
    branches:
      - master
      - v3
  pull_request:


jobs:
  core:
    runs-on: ubuntu-26.04
    # setup-ruby has no Ruby 3.1 or older builds for ubuntu-26.04, so use the official Ruby images.
    container: ruby:${{ matrix.ruby-version }}
    strategy:
      matrix:
        ruby-version: ['3.3', '3.2', '3.1', '3.0', '2.7', '2.6', '2.5', '2.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Bundler
        # The Ruby 2.7 and older images ship Bundler 1.17 or 2.1; install the versions setup-ruby used.
        run: |
          case "$RUBY_VERSION" in
            2.4.*|2.5.*) gem install bundler -v '~> 2.3.0' ;;
            2.6.*|2.7.*) gem install bundler -v '~> 2.4.0' ;;
          esac
      - name: Install gems
        run: bundle install --jobs 4
      - name: Run core tests
        run: |
          mkdir -p test_results
          bundle exec rspec spec --format progress --format RspecJunitFormatter --out test_results/rspec.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-results-${{ matrix.ruby-version }}
          path: test_results/rspec.xml
          retention-days: 30

  redis:
    runs-on: ubuntu-26.04
    # setup-ruby has no Ruby 3.1 or older builds for ubuntu-26.04, so use the official Ruby images.
    container: ruby:${{ matrix.ruby-version }}
    strategy:
      matrix:
        ruby-version: ['3.3', '3.2', '3.1', '3.0', '2.7', '2.6', '2.5', '2.4']
    env:
      REDIS_HOST: redis
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Bundler
        # The Ruby 2.7 and older images ship Bundler 1.17 or 2.1; install the versions setup-ruby used.
        run: |
          case "$RUBY_VERSION" in
            2.4.*|2.5.*) gem install bundler -v '~> 2.3.0' ;;
            2.6.*|2.7.*) gem install bundler -v '~> 2.4.0' ;;
          esac
      - name: Install gems
        working-directory: rollout-redis-adapter
        run: bundle install --jobs 4
      - name: Run Redis adapter tests
        working-directory: rollout-redis-adapter
        run: |
          mkdir -p test_results
          bundle exec rspec --format progress --format RspecJunitFormatter --out test_results/rspec.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: redis-test-results-${{ matrix.ruby-version }}
          path: rollout-redis-adapter/test_results/rspec.xml
          retention-days: 30

  active_record:
    runs-on: ubuntu-26.04
    # setup-ruby has no Ruby 3.1 or older builds for ubuntu-26.04, so use the official Ruby images.
    container: ruby:${{ matrix.ruby-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.3'
            activerecord: '~> 8.1.0'
            db: sqlite3
          - ruby-version: '3.3'
            activerecord: '~> 8.1.0'
            db: postgresql
          - ruby-version: '3.3'
            activerecord: '~> 8.1.0'
            db: mysql2
          - ruby-version: '3.3'
            activerecord: '~> 7.1.0'
            db: postgresql
          - ruby-version: '3.3'
            activerecord: '~> 7.1.0'
            db: mysql2
          - ruby-version: '3.2'
            activerecord: '~> 8.0.0'
            db: sqlite3
          - ruby-version: '3.1'
            activerecord: '~> 7.2.0'
            db: sqlite3
          - ruby-version: '2.7'
            activerecord: '~> 7.1.0'
            db: sqlite3
    env:
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}
      ROLLOUT_AR_ADAPTER: ${{ matrix.db }}
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rollout_test
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: rollout_test
      REDIS_HOST: redis
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rollout_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rollout_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Bundler
        # The Ruby 2.7 and older images ship Bundler 1.17 or 2.1; install the versions setup-ruby used.
        run: |
          case "$RUBY_VERSION" in
            2.4.*|2.5.*) gem install bundler -v '~> 2.3.0' ;;
            2.6.*|2.7.*) gem install bundler -v '~> 2.4.0' ;;
          esac
      - name: Install gems
        working-directory: rollout-active_record-adapter
        run: bundle install --jobs 4
      - name: Run Active Record adapter tests
        working-directory: rollout-active_record-adapter
        run: |
          mkdir -p test_results
          bundle exec rspec --format progress --format RspecJunitFormatter --out test_results/rspec.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: active-record-test-results-${{ matrix.ruby-version }}-${{ matrix.db }}-${{ strategy.job-index }}
          path: rollout-active_record-adapter/test_results/rspec.xml
          retention-days: 30
